name: concert-reminder

on:
  schedule:
    - cron: "0 * * * *"          # 每小時整點執行（GitHub 排程可能延遲幾十分鐘）
  workflow_dispatch:
    inputs:
      now:
        description: "假裝現在是（YYYY-MM-DD HH:MM，台北時間），留空＝現在"
        required: false
        default: ""
      deploy_board:
        description: "順便更新演唱會看板（GitHub Pages，多等約 1 分鐘）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: concert-reminder
  cancel-in-progress: false

jobs:
  check:                          # ① 檢查資料、挑出該提醒的場次（像 ETL）
    runs-on: ubuntu-latest
    outputs:
      reminders: ${{ steps.check.outputs.reminders }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          NOW: ${{ inputs.now }}
        run: bash scripts/check.sh
      - if: github.event_name == 'schedule' || inputs.deploy_board
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:                        # ② 發開賣／演出提醒（像下游應用）
    # TODO(第 2 關)：check 成功才輪到我 → 在這行下面加上 needs: check
    runs-on: ubuntu-latest
    environment: lab-env
    steps:
      - uses: actions/checkout@v4
      - env:
          REMINDERS: ${{ needs.check.outputs.reminders }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash scripts/publish.sh

  board:                          # ② 更新演唱會看板（課堂上預設不跑，省下部署時間）
    needs: check
    if: github.event_name == 'schedule' || inputs.deploy_board
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  alert:                          # ⚠️ 資料異常警示
    needs: [check, publish]
    # TODO(第 3 關)：只在前面失敗時才發警示 → 把 false 改成 failure()
    if: false
    runs-on: ubuntu-latest
    environment: lab-env
    steps:
      - uses: actions/checkout@v4
      - env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/teams.sh templates/alert-card.json "$(jq -n --arg url "$RUN_URL" '{url: $url}')"
